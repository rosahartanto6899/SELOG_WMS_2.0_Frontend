<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="50%" stop-color="#0e2036"/>
      <stop offset="100%" stop-color="#122a45"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#3aa0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowAmber" cx="50%" cy="62%" r="35%">
      <stop offset="0%" stop-color="#ffb545" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#7fb8ff" fill-opacity="0.10"/>
    </pattern>

    <linearGradient id="rackStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fc4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8fc4ff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="rackStrokeCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fc4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8fc4ff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="boxFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb545" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2892a" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#glowTop)"/>
  <rect width="1920" height="1080" fill="url(#glowAmber)"/>
  <rect width="1920" height="1080" fill="url(#dotGrid)"/>

  <!-- ceiling lamps (top, spread across width incl. center) -->
  <g>
    <circle cx="300"  cy="70" r="90" fill="url(#lampGlow)"/>
    <circle cx="960"  cy="55" r="130" fill="url(#lampGlow)"/>
    <circle cx="1620" cy="70" r="90" fill="url(#lampGlow)"/>
    <rect x="292" y="20" width="16" height="34" rx="3" fill="#dfeeff" fill-opacity="0.5"/>
    <rect x="952" y="10" width="16" height="34" rx="3" fill="#dfeeff" fill-opacity="0.6"/>
    <rect x="1612" y="20" width="16" height="34" rx="3" fill="#dfeeff" fill-opacity="0.5"/>
  </g>

  <!-- floor perspective lines converging to center vanishing point -->
  <g stroke="#8fc4ff" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="0" y1="740" x2="1920" y2="740"/>
    <line x1="960" y1="700" x2="0" y2="1080"/>
    <line x1="960" y1="700" x2="220" y2="1080"/>
    <line x1="960" y1="700" x2="620" y2="1080"/>
    <line x1="960" y1="700" x2="960" y2="1080"/>
    <line x1="960" y1="700" x2="1300" y2="1080"/>
    <line x1="960" y1="700" x2="1700" y2="1080"/>
    <line x1="960" y1="700" x2="1920" y2="1080"/>
  </g>

  <!-- LEFT racking, receding -->
  <g fill="none" stroke="url(#rackStroke)" stroke-width="2">
    <line x1="70"  y1="140" x2="40"  y2="840"/>
    <line x1="330" y1="200" x2="365" y2="815"/>
    <line x1="70"  y1="140" x2="330" y2="200"/>
    <line x1="60"  y1="290" x2="350" y2="330"/>
    <line x1="52"  y1="430" x2="358" y2="460"/>
    <line x1="45"  y1="575" x2="362" y2="600"/>
    <line x1="40"  y1="720" x2="365" y2="735"/>
  </g>
  <g opacity="0.85">
    <rect x="90"  y="305" width="46" height="34" rx="3" fill="url(#boxFill)"/>
    <rect x="155" y="312" width="40" height="30" rx="3" fill="#e2892a" opacity="0.55"/>
    <rect x="100" y="448" width="52" height="36" rx="3" fill="#e2892a" opacity="0.5"/>
    <rect x="180" y="455" width="42" height="32" rx="3" fill="url(#boxFill)"/>
    <rect x="85"  y="593" width="48" height="34" rx="3" fill="url(#boxFill)"/>
    <rect x="170" y="600" width="44" height="30" rx="3" fill="#e2892a" opacity="0.5"/>
  </g>

  <!-- RIGHT racking, receding -->
  <g fill="none" stroke="url(#rackStroke)" stroke-width="2">
    <line x1="1850" y1="120" x2="1885" y2="850"/>
    <line x1="1590" y1="185" x2="1560" y2="825"/>
    <line x1="1850" y1="120" x2="1590" y2="185"/>
    <line x1="1862" y1="265" x2="1575" y2="315"/>
    <line x1="1872" y1="410" x2="1568" y2="450"/>
    <line x1="1880" y1="560" x2="1562" y2="590"/>
    <line x1="1886" y1="705" x2="1558" y2="725"/>
  </g>
  <g opacity="0.85">
    <rect x="1615" y="290" width="46" height="34" rx="3" fill="#e2892a" opacity="0.5"/>
    <rect x="1685" y="298" width="40" height="30" rx="3" fill="url(#boxFill)"/>
    <rect x="1600" y="435" width="50" height="36" rx="3" fill="url(#boxFill)"/>
    <rect x="1680" y="442" width="42" height="30" rx="3" fill="#e2892a" opacity="0.55"/>
    <rect x="1605" y="580" width="46" height="32" rx="3" fill="#e2892a" opacity="0.5"/>
    <rect x="1675" y="586" width="44" height="30" rx="3" fill="url(#boxFill)"/>
  </g>

  <!-- CENTER racking, receding aisle down the middle (fills the empty core) -->
  <g fill="none" stroke="url(#rackStrokeCenter)" stroke-width="1.6">
    <line x1="700" y1="230" x2="620" y2="640"/>
    <line x1="1220" y1="230" x2="1300" y2="640"/>
    <line x1="700" y1="230" x2="1220" y2="230"/>
    <line x1="690" y1="320" x2="1230" y2="320"/>
    <line x1="670" y1="430" x2="1250" y2="430"/>
    <line x1="645" y1="540" x2="1275" y2="540"/>
  </g>
  <g opacity="0.75">
    <rect x="730" y="335" width="44" height="30" rx="3" fill="#e2892a" opacity="0.45"/>
    <rect x="1150" y="335" width="44" height="30" rx="3" fill="url(#boxFill)" opacity="0.55"/>
    <rect x="720" y="445" width="48" height="32" rx="3" fill="url(#boxFill)" opacity="0.5"/>
    <rect x="1155" y="448" width="44" height="30" rx="3" fill="#e2892a" opacity="0.45"/>
  </g>

  <!-- central forklift silhouette (fills the empty middle-lower area) -->
  <g transform="translate(830,610)" opacity="0.9">
    <!-- body -->
    <rect x="30" y="70" width="150" height="60" rx="8" fill="#12314f" stroke="#8fc4ff" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="150" y="20" width="16" height="120" rx="3" fill="#12314f" stroke="#8fc4ff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="180" y="30" width="14" height="110" rx="3" fill="#12314f" stroke="#8fc4ff" stroke-opacity="0.5" stroke-width="2"/>
    <!-- forks -->
    <rect x="196" y="112" width="70" height="8" fill="#dfeeff" fill-opacity="0.55"/>
    <rect x="196" y="128" width="70" height="8" fill="#dfeeff" fill-opacity="0.55"/>
    <!-- pallet + boxes on forks -->
    <rect x="260" y="96" width="52" height="10" fill="#5c4326" opacity="0.7"/>
    <rect x="266" y="46" width="42" height="50" rx="3" fill="url(#boxFill)"/>
    <!-- cabin -->
    <rect x="55" y="18" width="70" height="55" rx="6" fill="#12314f" stroke="#8fc4ff" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="60" y1="18" x2="60" y2="73" stroke="#8fc4ff" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="120" y1="18" x2="120" y2="73" stroke="#8fc4ff" stroke-opacity="0.4" stroke-width="2"/>
    <!-- wheels -->
    <circle cx="55" cy="140" r="20" fill="#0a1526" stroke="#8fc4ff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="150" cy="140" r="20" fill="#0a1526" stroke="#8fc4ff" stroke-opacity="0.55" stroke-width="3"/>
    <!-- warning light -->
    <circle cx="90" cy="10" r="5" fill="#ffb545"/>
  </g>

  <!-- crate stacks flanking the forklift -->
  <g opacity="0.9">
    <rect x="560" y="760" width="150" height="18" rx="2" fill="#5c4326" opacity="0.7"/>
    <rect x="580" y="675" width="60" height="80" rx="4" fill="url(#boxFill)" opacity="0.85"/>
    <rect x="648" y="700" width="52" height="55" rx="4" fill="#e2892a" opacity="0.6"/>

    <rect x="1210" y="770" width="150" height="18" rx="2" fill="#5c4326" opacity="0.7"/>
    <rect x="1230" y="685" width="60" height="80" rx="4" fill="#e2892a" opacity="0.65"/>
    <rect x="1298" y="710" width="52" height="55" rx="4" fill="url(#boxFill)" opacity="0.75"/>
  </g>

  <!-- scanning / HUD data motif around the forklift, centered -->
  <g stroke="#7fd4ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2 6">
    <rect x="790" y="560" width="340" height="230" rx="10" fill="none"/>
    <path d="M 790 560 h 26 M 790 560 v 26"/>
    <path d="M 1130 560 h -26 M 1130 560 v 26"/>
    <path d="M 790 790 h 26 M 790 790 v -26"/>
    <path d="M 1130 790 h -26 M 1130 790 v -26"/>
  </g>
  <circle cx="1015" cy="500" r="3.5" fill="#7fd4ff" fill-opacity="0.8"/>
  <text x="1028" y="505" font-family="Consolas, monospace" font-size="13" fill="#a9d8ff" fill-opacity="0.55">SCAN OK</text>

  <!-- barcode motif, bottom right, decorative -->
  <g transform="translate(1660,975)" opacity="0.5">
    <rect x="0"  y="0" width="4"  height="46" fill="#dfeeff"/>
    <rect x="8"  y="0" width="2"  height="46" fill="#dfeeff"/>
    <rect x="14" y="0" width="6"  height="46" fill="#dfeeff"/>
    <rect x="24" y="0" width="2"  height="46" fill="#dfeeff"/>
    <rect x="30" y="0" width="4"  height="46" fill="#dfeeff"/>
    <rect x="38" y="0" width="2"  height="46" fill="#dfeeff"/>
    <rect x="44" y="0" width="8"  height="46" fill="#dfeeff"/>
    <rect x="56" y="0" width="3"  height="46" fill="#dfeeff"/>
    <rect x="64" y="0" width="5"  height="46" fill="#dfeeff"/>
    <rect x="74" y="0" width="2"  height="46" fill="#dfeeff"/>
  </g>

  <!-- vignette to keep enough contrast wherever the login card sits -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
