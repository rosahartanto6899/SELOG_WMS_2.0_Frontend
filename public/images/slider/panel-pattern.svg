<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1080" width="600" height="1080">
  <g fill="none" stroke="#3a8ddb" stroke-width="2.5" opacity="0.55">
    <!-- top-right rack, receding -->
    <line x1="640" y1="-40" x2="600" y2="230"/>
    <line x1="430" y1="10" x2="410" y2="215"/>
    <line x1="640" y1="-40" x2="430" y2="10"/>
    <line x1="620" y1="55" x2="418" y2="80"/>
    <line x1="610" y1="140" x2="412" y2="155"/>
  </g>
  <g fill="#3a8ddb" opacity="0.5">
    <rect x="450" y="65" width="34" height="26" rx="3"/>
    <rect x="500" y="70" width="30" height="24" rx="3"/>
    <rect x="440" y="148" width="36" height="26" rx="3"/>
    <rect x="500" y="152" width="30" height="24" rx="3"/>
  </g>

  <!-- bottom-left rack, receding -->
  <g fill="none" stroke="#3a8ddb" stroke-width="2.5" opacity="0.5">
    <line x1="-40" y1="760" x2="20" y2="1040"/>
    <line x1="180" y1="815" x2="160" y2="1060"/>
    <line x1="-40" y1="760" x2="180" y2="815"/>
    <line x1="-30" y1="870" x2="172" y2="905"/>
    <line x1="-20" y1="960" x2="164" y2="985"/>
  </g>
  <g fill="#3a8ddb" opacity="0.45">
    <rect x="10" y="885" width="34" height="26" rx="3"/>
    <rect x="65" y="892" width="30" height="24" rx="3"/>
    <rect x="0" y="975" width="36" height="26" rx="3"/>
    <rect x="60" y="980" width="30" height="24" rx="3"/>
  </g>

  <!-- crate stack, bottom-left floor -->
  <g fill="#3a8ddb" opacity="0.4">
    <rect x="20" y="1040" width="90" height="12" rx="2"/>
    <rect x="32" y="985" width="36" height="56" rx="3"/>
    <rect x="74" y="1000" width="32" height="41" rx="3"/>
  </g>

  <!-- barcode motif, top-right -->
  <g transform="translate(520,10)" opacity="0.4" fill="#3a8ddb">
    <rect x="0" y="0" width="3" height="34" />
    <rect x="6" y="0" width="2" height="34" />
    <rect x="11" y="0" width="4" height="34" />
    <rect x="18" y="0" width="2" height="34" />
    <rect x="23" y="0" width="3" height="34" />
    <rect x="29" y="0" width="2" height="34" />
    <rect x="34" y="0" width="6" height="34" />
  </g>
</svg>
