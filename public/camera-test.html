<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>Camera Test</title></head>
  <body style="font-family: sans-serif; margin: 40px">
    <h2>Camera Test</h2>
    <video id="v" autoplay muted playsinline style="width: 100%; max-width: 640px; background: #000; min-height: 300px"></video>
    <pre id="log" style="white-space: pre-wrap"></pre>
    <script>
      const log = (m) => (document.getElementById("log").textContent += m + "\n");
      log("mediaDevices: " + (navigator.mediaDevices ? "ada" : "TIDAK ADA (butuh HTTPS/localhost)"));
      navigator.mediaDevices
        .getUserMedia({ video: { facingMode: "environment" } })
        .then((s) => {
          log("stream OK: " + s.getVideoTracks().map((t) => t.label).join(", "));
          document.getElementById("v").srcObject = s;
        })
        .catch((e) => log("GAGAL: " + e.name + " — " + e.message));
    </script>
  </body>
</html>
